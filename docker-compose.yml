services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: logshield
      MYSQL_USER: logshield
      MYSQL_PASSWORD: logshield
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: mysql+pymysql://logshield:logshield@db:3306/logshield
      SECRET_KEY: change-me-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
